[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessera"
version = "0.1.0"
description = "Tessera v1 — file-system-native ticket runtime framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6.0",
    "inotify-simple>=1.3.5",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tessera = "ticket_management.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tessera", "lib/ticket-management/ticket_management"]

[tool.pytest.ini_options]
testpaths = ["tests"]
